# Rebuilds the site once a day so the telemetry cards stay current without
# needing a content change. Vercel Cron needs a serverless function, and this
# site is deliberately pure static, so a deploy hook is the lighter option.
#
# Setup: Vercel → Project → Settings → Git → Deploy Hooks → create one, then add
# the URL as the VERCEL_DEPLOY_HOOK_URL repository secret.
name: Refresh telemetry

on:
  schedule:
    # 04:15 UTC daily — after the overnight ride uploads have settled.
    - cron: '15 4 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not set; nothing to do."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$HOOK"
